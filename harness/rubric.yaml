# Единая рубрика Bitrix AI Challenge: по ней ставят баллы модель-ревьювер и автор, итог = среднее 50/50.
# Два среза по 100. Оценивается только перечисленное; оценка субъективная, но
# ревьювер обязан дать хотя бы одно evidence на критерий (файл:строка или место на сайте).

visual:
  - id: reference
    max: 35
    desc: >
      Референс: URL в SOLUTION.md → Reference открывается, выбор уместен для бьюти-лендинга
      и амбициозен. Главное — узнаваемость: открой референс и лендинг рядом на десктопе
      и на мобильной ширине — это одна и та же страница с другим содержимым? Хиро, сетка,
      шрифты, палитра, ритм секций, движение (появление при скролле, hover/focus,
      переходы состояний). Сверь разбор из Reference с тем, что реально есть на странице:
      обещанный приём, которого нет, — минус. Нет URL или ссылка битая — 0.
      «Взял палитру и общий дух, а сделал свой шаблон» — не выше трети.
  - id: composition
    max: 25
    desc: >
      Страница сама по себе: иерархия секций, воздух, выравнивания, согласованность
      на 360 / 768 / 1440, без горизонтального скролла, работа с клавиатуры,
      reduced-motion, alt у картинок.
  - id: content
    max: 15
    desc: >
      Тексты: оффер продаёт, описания услуг конкретны, отзывы правдоподобны и различимы
      по голосу. Штампы, канцелярит, следы «рыбы» — минус.
  - id: frontend-code
    max: 15
    desc: >
      Код вёрстки: осмысленная структура CSS (переменные, именование), без копипасты
      и мёртвых стилей; JS формы и слотов читаем, состояния обрабатываются явно;
      всё локально, без внешних ресурсов.
  - id: solution-doc
    max: 10
    desc: >
      SOLUTION.md: допущения и отклонения осмысленны и соответствуют коду.
      Длина не достоинство.

backend:
  - id: architecture-d7
    max: 30
    desc: >
      Написал бы так опытный битрикс-разработчик: слои Controller → Service → Repository
      реальны, а не номинальны; Loader, Loc, ServiceLocator и .settings.php модуля,
      ActionFilter на контроллере, Result/Error как канал ошибок, почтовое событие,
      компонент по канону, админка штатными списками/фильтрами с меню и правами модуля.
      PHP-фреймворк, натянутый на Битрикс, — низко.
  - id: data
    max: 20
    desc: >
      ORM-сущности по контракту; гонка за слот решена на уровне БД (уникальный индекс
      или блокировка), не «прочитал → решил → записал»; инфоблоки, наполнение и
      расписание создаются кодом: миграции sprint.migration лучше сидинга из install,
      сидинг лучше «создано руками».
  - id: errors-security
    max: 15
    desc: >
      Коды ошибок из контракта, ошибки БД не текут в ответ; фильтры POST/CSRF, валидация
      входа, экранирование вывода; согласие — активное действие с отметкой времени;
      ПДн не текут в slots.list, исходник страницы и логи; админка закрыта правами.
  - id: readability
    max: 15
    desc: >
      Открой три случайных файла: понятно ли с листа. Именование, размер методов,
      отсутствие копипасты и мёртвого кода, комментарии только там, где нужны.
  - id: code-style
    max: 10
    desc: >
      Следование AGENTS.md: declare(strict_types=1), PSR-12, final/readonly/enum/match,
      типизированные параметры и возвраты, <?= в шаблонах, Loc вместо строк,
      Context/Request вместо $_GET/$_POST, код только в /local.
  - id: solution-doc
    max: 10
    desc: >
      SOLUTION.md: инженерные решения (гонка, воспроизводимость, админка) названы
      и совпадают с реализацией.
